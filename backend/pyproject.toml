[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farmshield-backend"
version = "0.1.0"
description = "FarmShield AI backend and intelligence engine"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "pydantic==2.14.3",
    "rasterio==1.5.2",
    "affine==3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

